main:
  params: [args]
  steps:
    - init:
        assign:
          - projectId: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: "us-central1"
          - imageUri: ${region + "-docker.pkg.dev/" + projectId + "/containers/nsass-lm-array:v11"}
          - jobId: ${"job-r-analysis-" + string(int(sys.now()))}
          - bucket: "nsass-gc-bucket" 
    - logCreateBatchJob:
        call: sys.log
        args:
          data: ${"Running isolated container test " + jobId}
    - createAndRunBatchJob:
        call: googleapis.batch.v1.projects.locations.jobs.create
        args:
            parent: ${"projects/" + projectId + "/locations/" + region}
            jobId: ${jobId}
            body:
              taskGroups:
                taskSpec:
                  computeResource:
                    cpuMilli: "2000"
                    memoryMib: "8192"
                  
                  runnables:
                    - container:
                        imageUri: ${imageUri}
                        commands: ["Rscript", "/app/run_lm_gc_array.r"]
                      environment:
                        variables:
                          GCS_BUCKET: ${bucket}
                  
                taskCount: 10
                parallelism: 5
                
              # UPDATED: Force external IPs so the VMs can talk to the registry
              allocationPolicy:
                location:
                  allowedLocations:
                    - "regions/us-central1"
                network:
                  networkInterfaces:
                    - network: "global/networks/default"
                      noExternalIpAddress: false  # <-- CRITICAL: Gives the VM internet access to pull the image

              logsPolicy:
                destination: CLOUD_LOGGING
        result: createAndRunBatchJobResponse
    - logDeleteBatchJob:
        call: sys.log
        args:
          data: ${"Deleting the batch job metadata " + jobId}
    - deleteBatchJob:
        call: googleapis.batch.v1.projects.locations.jobs.delete
        args:
            name: ${"projects/" + projectId + "/locations/" + region + "/jobs/" + jobId}
        result: deleteResult
    - returnResult:
        return:
          jobId: ${jobId}
          status: "Test completed."